<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Juego de taller: reparte coches y repara con tus manos, con pasos de seguridad evaluados. Por Carlo Prado Ortiz.">
<title>Taller Twin · Simulador de taller</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23f2b33d%22/%3E%3Cpath d=%22M9 23l8-8m2-6a4 4 0 104 4l-3 1-2-2z%22 stroke=%22%231b1404%22 stroke-width=%222.6%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: una sola pantalla de juego (canvas 16:9) con el HUD encima y la instructora + mandos táctiles debajo. Aspecto de nave de taller: hormigón oscuro y ámbar de seguridad. Un único look oscuro, a propósito. */
:root{
  --bg:#101417; --panel:#1b2227; --panel2:#242d34; --line:#36424c;
  --fg:#e8edf0; --muted:#9fadb7; --amber:#f2b33d; --ink:#1b1404;
  --ok:#5cc28a; --bad:#ff6b5e; --info:#6fb6ff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1280px;margin:0 auto;padding-block:14px 40px;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(-45deg,var(--amber) 0 10px,transparent 10px 20px)}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.05em;text-transform:uppercase;line-height:1;margin:0}
.brand span{color:var(--amber)}
.stat{display:flex;flex-direction:column;min-width:0}
.stat b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat.warn b{color:var(--bad)}
.hud .grow{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;min-width:44px;min-height:40px;padding:6px 12px;font-size:13px}
.icon-btn:hover{border-color:var(--amber)}

.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#161b1f}
#game{display:block;width:100%;max-width:100%;aspect-ratio:16/9;touch-action:none;cursor:pointer}

.coach{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:64px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--amber);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;flex:none}
.coach .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.coach p{margin:0;font-size:16px;text-wrap:pretty}
.coach .msg{flex:1;min-width:0}
kbd{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap}

.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;user-select:none;-webkit-user-select:none}
.pad button{min-width:64px;min-height:56px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:20px;font-weight:600;touch-action:none}
.pad button.act{background:var(--amber);color:var(--ink);border-color:var(--amber);font-size:16px;min-width:180px;padding:0 18px}
.pad button.on{border-color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}

.overlay{position:fixed;inset:0;background:rgba(6,8,10,.7);display:grid;place-items:center;z-index:40;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:620px;width:100%;max-height:100%;overflow:auto}
.modal header{padding:22px 24px 8px;position:relative}
.modal header::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(-45deg,var(--amber) 0 10px,transparent 10px 20px)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:600}
.modal h2{margin:6px 0 0;font-family:var(--display);font-size:38px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1;text-wrap:balance}
.mb{padding:10px 24px 6px;display:flex;flex-direction:column;gap:12px}
.mb p{margin:0}
.modal footer{padding:14px 24px 22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 16px;min-height:46px;font-weight:600}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn:hover{border-color:var(--amber)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.how div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.how b{display:block;color:var(--fg);font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:14px}
.checks .mk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ok);color:var(--ok);display:grid;place-items:center;font-size:12px;font-weight:700}
.checks .fail .mk{border-color:var(--bad);color:var(--bad)}
.tag{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-left:6px}
.stars{font-size:34px;letter-spacing:4px;color:var(--amber);line-height:1}
.stars .off{color:var(--line)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.sum div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.sum b{display:block;font-family:var(--mono);font-size:20px}
.sum small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.foot{color:var(--muted);font-size:12.5px;text-align:center}
.foot a{color:var(--amber)}
@media (max-width:640px){.brand{font-size:22px}.stat b{font-size:17px}.coach p{font-size:14.5px}.modal h2{font-size:30px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="hud">
    <h1 class="brand">Taller <span>Twin</span></h1>
    <div class="stat"><b id="hClock">09:00</b><small>Turno de mañana</small></div>
    <div class="stat"><b id="hMoney">0 €</b><small>Caja</small></div>
    <div class="stat"><b id="hStars">–</b><small>Valoración</small></div>
    <div class="stat" id="hWaitBox"><b id="hWait">0</b><small>Esperando</small></div>
    <div class="grow"></div>
    <button class="icon-btn" id="bPause" aria-pressed="false">Pausa</button>
    <button class="icon-btn" id="bSound" aria-pressed="true">Sonido: sí</button>
  </header>

  <div class="stage"><canvas id="game" width="1280" height="720" role="img" aria-label="Juego del taller: cola de clientes, tres elevadores y la reparación en tu elevador"></canvas></div>

  <div class="coach" aria-live="polite">
    <div class="avatar" aria-hidden="true">AN</div>
    <div class="msg"><div class="who">Ana · encargada</div><p id="msg">Bienvenido al taller.</p></div>
  </div>

  <div class="pad" id="pad" hidden>
    <button id="pL" data-k="left" aria-label="Izquierda">◀</button>
    <button id="pU" data-k="up" aria-label="Arriba o avanzar">▲</button>
    <button id="pD" data-k="down" aria-label="Abajo o atrás">▼</button>
    <button id="pR" data-k="right" aria-label="Derecha">▶</button>
    <button id="pA" data-k="act" class="act">Acción</button>
  </div>

  <p class="foot">Simulador hecho por Carlo Prado Ortiz con las reglas de un taller real · <a href="https://zitroolrac.github.io/Portfolio/" target="_blank" rel="noopener">Volver al portafolio</a></p>
</div>

<div class="overlay" id="ov" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mT" id="modal"></div></div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const W=1280,H=720;
const cv=$('game'),ctx=cv.getContext('2d');
const C={bg:'#161b1f',floor:'#1c2328',floor2:'#20282e',line:'#36424c',fg:'#e8edf0',muted:'#9fadb7',amber:'#f2b33d',ink:'#1b1404',ok:'#5cc28a',bad:'#ff6b5e',info:'#6fb6ff',panel:'#1b2227',panel2:'#242d34'};
const DISP='"Barlow Condensed","Arial Narrow",Arial,sans-serif', MONO='"JetBrains Mono",ui-monospace,monospace', BODY='"IBM Plex Sans",system-ui,sans-serif';
const PAINT=['#d23c2f','#2f5fa8','#e8e6df','#2b2f33','#d9b03c','#3c7a63','#8a8f95','#7a3fa0','#c96a2b','#5aa0c8'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eur=n=>Math.round(n).toLocaleString('es-ES')+' €';
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0');
function plate(){const L='BCDFGHJKLMNPRSTVWXYZ',c=()=>L[Math.floor(Math.random()*L.length)];return Math.floor(rand(1000,9999))+' '+pick(['K','L','M','N'])+c()+c()}

/* ---------- averías: lo que se aprende ---------- */
const FAULTS={
 frenos:{sym:'Chirría al frenar',part:'Pinza de freno',tool:'Inspección visual',read:'Pastillas: 2 mm',ref:'Mínimo seguro: 3 mm',opts:['Cambiar pastillas y discos','Cambiar amortiguador','Recargar el aire'],ok:0,lo:100,hi:120,pay:180},
 alternador:{sym:'Se queda sin batería',part:'Alternador',tool:'Multímetro',read:'11,8 V con el motor en marcha',ref:'Debe dar entre 13,8 y 14,4 V',opts:['Cambiar la batería','Cambiar el alternador','Cambiar la sonda lambda'],ok:1,lo:40,hi:50,pay:260},
 lambda:{sym:'Luz de motor encendida',part:'Sonda lambda',tool:'Escáner OBD',read:'P0133 · Sonda lambda B1S1 lenta',ref:'Código de avería guardado en la centralita',opts:['Cambiar la sonda lambda','Cambiar las bujías','Cambiar el alternador'],ok:0,lo:40,hi:50,pay:150},
 amortiguador:{sym:'Bota mucho de atrás',part:'Amortiguador trasero',tool:'Prueba de rebote',read:'4 oscilaciones al soltar',ref:'Uno sano se para en 1',opts:['Cambiar la rótula','Cambiar el amortiguador','Cambiar pastillas'],ok:1,lo:80,hi:100,pay:220},
 rotula:{sym:'Ruido al girar',part:'Rótula de dirección',tool:'Prueba de holgura',read:'La rueda tiene juego lateral',ref:'No debe moverse nada',opts:['Cambiar la rótula','Cambiar el amortiguador','Equilibrar las ruedas'],ok:0,lo:50,hi:60,pay:170},
 aire:{sym:'El aire no enfría',part:'Racores del aire',tool:'Manómetro',read:'1,2 bar en el circuito de baja',ref:'En marcha debe marcar 2 a 3 bar',opts:['Cambiar el filtro de habitáculo','Cambiar el compresor','Recargar el gas'],ok:2,lo:15,hi:20,pay:120}
};
const FKEYS=Object.keys(FAULTS);
const CHECKS=[
 ['k1','Entra recto sin golpear',true],['k2','Freno de mano dentro de la zona',false],
 ['k3','Brazos en puntos de apoyo',true],['k4','Parada de comprobación a 20 cm',true],
 ['k5','Altura de trabajo y seguro puesto',false],['k6','Diagnóstico correcto',true],
 ['k7','Afloja y aprieta en estrella',false],['k8','Par de apriete correcto',true],
 ['k9','Zona despejada antes de bajar',true]];
const STEPS=['Entrar al elevador','Brazos del elevador','Subir el coche','Diagnóstico','Reparación','Bajar y entregar'];
const NPC=[null,{name:'Luis',min:110,cut:.7},{name:'Andrés',min:140,cut:.7}];

/* ---------- sonido ---------- */
let AC=null,soundOn=true,hum=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function beep(f,d,type,v,slide){if(!soundOn||!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const sfx={ok:()=>{beep(660,.09,'square',.05);setTimeout(()=>beep(990,.12,'square',.05),70)},bad:()=>beep(160,.3,'sawtooth',.07,90),click:()=>beep(420,.04,'square',.04),coin:()=>{beep(880,.06,'square',.05);setTimeout(()=>beep(1320,.12,'square',.05),60)},bump:()=>beep(90,.25,'triangle',.18,50),ratchet:()=>beep(1800,.015,'square',.025)};
function setHum(on,f){if(!AC)return;if(on&&soundOn){if(!hum){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=f||70;g.gain.value=.025;o.connect(g).connect(AC.destination);o.start();hum={o,g}}hum.o.frequency.value=f||70}else if(hum){hum.o.stop();hum=null}}

/* ---------- entrada ---------- */
const keys={up:0,down:0,left:0,right:0,act:0};let actEdge=false;
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'act',KeyE:'act'};
window.addEventListener('keydown',e=>{const k=KM[e.code];if(!k||!$('ov').hidden)return;e.preventDefault();audio();if(k==='act'&&!keys.act)actEdge=true;keys[k]=1});
window.addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=0});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(k==='act')actEdge=true;keys[k]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}});
  const up=()=>{keys[k]=0;b.classList.remove('on')};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});
function takeAct(){const a=actEdge;actEdge=false;return a}

let hold=null;const ptr={x:0,y:0},UI=[];
/* ---------- estado ---------- */
let G;
let played=false;
function newShift(){
  const tut=!played;played=true;
  G={phase:'shop',min:540,end:840,clockOn:false,money:0,mine:0,theirs:0,lost:0,stars:[],queue:[],bays:[null,null,null],sel:null,
     nid:1,nextArrive:560,tut:0,first:true,floats:[],shake:0,paused:false,R:null,toast:null};
  addCar(pick(['frenos','alternador']));
  if(tut)setMsg('Llega tu primer cliente. <b>Toca su coche</b> en la entrada.');
  else{G.first=false;G.clockOn=true;G.tut=2;addCar();setMsg('Nuevo turno. Reparte los coches antes de que se acabe la paciencia.')}
}
function addCar(fk){
  if(G.queue.length>=4){G.lost++;toast('Cola llena: un cliente se va a otro taller','bad');return}
  G.queue.push({id:G.nid++,plate:plate(),color:pick(PAINT),fault:fk||pick(FKEYS),pat:1,x:-160,y:QY[G.queue.length]});
}
let msgHTML='',msgAt=-9;
function setMsg(h){if(h!==msgHTML){msgHTML=h;msgAt=T;$('msg').innerHTML=h}}
function toast(t,cls){G.toast={t,cls,life:3}}
function float(x,y,t,col){G.floats.push({x,y,t,col:col||C.amber,life:1.6})}

/* ---------- taller (vista general) ---------- */
const QY=[205,325,445,565], QX=160;
const BX=[520,800,1080], BY=150, BW=230, BH=430;
function shopUpdate(dt){
  const run=G.clockOn&&!G.paused;
  const gm=run?dt/1.2:0; // 1 minuto de juego = 1,2 s
  G.min+=gm;
  if(run&&G.min>=G.nextArrive&&G.min<G.end-25){addCar();G.nextArrive=G.min+rand(24,42)}
  G.queue.forEach((c,i)=>{c.pat-=gm/85;const ty=QY[i];c.y+=(ty-c.y)*Math.min(1,dt*6);c.x+=(QX-c.x)*Math.min(1,dt*4)});
  for(let i=G.queue.length-1;i>=0;i--){const c=G.queue[i];if(c.pat<=0){G.queue.splice(i,1);G.lost++;if(G.sel===c.id)G.sel=null;toast(`${c.plate}: el cliente se ha cansado de esperar`,'bad');sfx.bad()}}
  for(let b=1;b<3;b++){const j=G.bays[b];if(!j)continue;j.x+=(BX[b]-j.x)*Math.min(1,dt*4);j.y+=(BY+BH/2-j.y)*Math.min(1,dt*4);
    j.prog+=gm/NPC[b].min;if(j.prog>=1){const f=FAULTS[j.fault];const p=f.pay*NPC[b].cut;G.money+=p;G.theirs++;float(BX[b],BY+80,'+'+eur(p),C.ok);sfx.coin();G.bays[b]=null}}
  if(G.min>=G.end&&G.phase==='shop'&&G.clockOn){G.min=G.end;endShift()}
}
function shopClick(x,y){
  const qi=G.queue.findIndex((c,i)=>Math.abs(x-QX)<110&&y>QY[i]-74&&y<QY[i]+54);
  if(qi>=0){G.sel=G.queue[qi].id;sfx.click();if(G.tut===0){G.tut=1;setMsg('Bien. Ahora <b>toca tu elevador</b>, el número 1, marcado como <b>TÚ</b>.')}return}
  for(let b=0;b<3;b++){if(x>BX[b]-BW/2&&x<BX[b]+BW/2&&y>BY&&y<BY+BH){assign(b);return}}
}
function assign(b){
  const i=G.queue.findIndex(c=>c.id===G.sel);if(i<0){if(G.tut>=2)setMsg('Primero toca un coche de la entrada.');return}
  if(G.first&&b!==0){setMsg('Este primero lo haces tú: <b>toca el elevador 1</b>.');sfx.bad();return}
  if(G.bays[b]){sfx.bad();setMsg(`El elevador ${b+1} está ocupado.`);return}
  const c=G.queue.splice(i,1)[0];G.sel=null;
  if(b===0){startRepair(c)}
  else{c.prog=0;G.bays[b]=c;sfx.ok();setMsg(`${NPC[b].name} se encarga del ${c.plate}. Tarda más y cobra su parte, pero te libera.`)}
}
function shopHint(){
  if(G.tut<2||T-msgAt<3.5)return;
  const w=G.queue.length, low=G.queue.reduce((m,c)=>Math.min(m,c.pat),1);
  if(!w)setMsg('No hay nadie esperando. Llegarán más clientes; el turno acaba a las 14:00.');
  else if(low<.35)setMsg(`¡Hay un cliente a punto de irse! Tócalo y dáselo a un elevador libre.`);
  else setMsg(`Hay ${w} coche${w>1?'s':''} esperando. Hazlos tú en el elevador 1 (más dinero y estrellas) o pásalos a Luis y Andrés.`);
}

/* ---------- reparación: 6 pasos ---------- */
function startRepair(c){
  const f=FAULTS[c.fault];
  G.phase='repair';
  G.R={car:c,f,step:0,k:{},t:0,
    drive:{y:900,x:450+rand(-55,55),v:0,hit:0},
    sup:{pts:makePoints(),placed:[]},
    lift:{h:0,checked:false,locked:false,warned:false},
    diag:{wrong:-1},
    rep:{phase:'loosen',order:[],last:-1,cur:-1,tq:0,done:[],hold:0,bad:[]},
    low:{unlocked:false,box:Math.random()<.65,boxX:450,done:false}};
  stepEnter();sfx.ok();
}
function makePoints(){
  const ok=[[-82,-118],[82,-118],[-82,118],[82,118]].map(p=>({x:p[0],y:p[1],ok:true}));
  const no=[[0,-196,'Paragolpes'],[0,196,'Paragolpes'],[-92,0,'Chapa del umbral'],[92,0,'Chapa del umbral']].map(p=>({x:p[0],y:p[1],ok:false,n:p[2]}));
  return ok.concat(no);
}

function drawFX(dt){
  G.floats=G.floats.filter(f=>(f.life-=dt)>0);G.floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life);txt(f.t,f.x,f.y-(1.6-f.life)*60,f.col,34,DISP,'center');ctx.globalAlpha=1});
  if(G.toast){G.toast.life-=dt;if(G.toast.life<=0)G.toast=null;else{ctx.globalAlpha=Math.min(1,G.toast.life);ctx.font=`17px ${BODY}`;const w=ctx.measureText(G.toast.t).width+36;ctx.fillStyle=G.toast.cls==='bad'?'#5a1f1b':C.panel2;rr(W/2-w/2,H-70,w,40,8);ctx.fill();txt(G.toast.t,W/2,H-50,C.fg,17,BODY,'center');ctx.globalAlpha=1}}
  if(G.paused){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);txt('EN PAUSA',W/2,H/2,C.fg,60,DISP,'center')}
  if(G.phase==='repair'&&G.clockOn){const w=G.queue.length;if(w){const low=G.queue.reduce((m,c)=>Math.min(m,c.pat),1);ctx.fillStyle=low<.3?'rgba(255,107,94,.9)':'rgba(36,45,52,.92)';rr(20,H-56,300,38,8);ctx.fill();txt(`${w} esperando fuera${low<.3?' · ¡date prisa!':''}`,36,H-37,C.fg,16,BODY)}}
}

/* ---------- bucle ---------- */
let last=performance.now(),hudT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;G.shake=Math.max(0,G.shake-dt);
  const modal=!$('ov').hidden;
  if(!modal&&!G.paused){
    if(G.phase==='shop'||G.phase==='repair')shopUpdate(dt);
    if(G.phase==='repair'&&G.R)repairUpdate(dt);
  } else takeAct();
  ctx.setTransform(scale,0,0,scale,0,0);
  if(G.phase==='repair'&&G.R)drawRepair();else drawShop();
  drawFX(dt);
  hudT+=dt;if(hudT>.2){hudT=0;hud();if(G.phase==='shop')shopHint()}
  requestAnimationFrame(frame);
}
function hud(){
  $('hClock').textContent=hhmm(G.min);$('hMoney').textContent=eur(G.money);
  const avg=G.stars.length?G.stars.reduce((a,b)=>a+b,0)/G.stars.length:null;$('hStars').textContent=avg==null?'–':avg.toFixed(1).replace('.',',')+' ★';
  $('hWait').textContent=G.queue.length;$('hWaitBox').classList.toggle('warn',G.queue.some(c=>c.pat<.3));
}
function ptrXY(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
cv.addEventListener('pointerdown',e=>{
  audio();const [x,y]=ptrXY(e);ptr.x=x;ptr.y=y;
  if(G.paused||!$('ov').hidden)return;
  if(G.phase==='shop'){shopClick(x,y);return}
  if(G.phase!=='repair'||!G.R)return;
  e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const b=UI.find(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h);
  if(b){if(b.tap){actEdge=true;sfx.click()}else hold=b.key;return}
  const R=G.R;repairClick(x,y);
  if(R.step===0&&x<900)hold='drive';
  if(R.step===4){const r=R.rep;if(r.phase==='swap'&&Math.hypot(x-450,y-380)<200)hold='act';if(r.phase==='tighten'&&r.cur>=0&&boltAt(x,y)===r.cur)hold='act'}
});
cv.addEventListener('pointermove',e=>{const [x,y]=ptrXY(e);ptr.x=x;ptr.y=y});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>cv.addEventListener(ev,()=>{hold=null}));
$('bPause').addEventListener('click',()=>{G.paused=!G.paused;$('bPause').setAttribute('aria-pressed',String(G.paused));$('bPause').textContent=G.paused?'Seguir':'Pausa';setHum(false)});
$('bSound').addEventListener('click',()=>{soundOn=!soundOn;$('bSound').setAttribute('aria-pressed',String(soundOn));$('bSound').textContent='Sonido: '+(soundOn?'sí':'no');if(!soundOn)setHum(false);else{audio();sfx.click()}});

/* ---------- inicio ---------- */
newShift();
openModal({eyebrow:'Simulador de taller · turno de mañana',title:'Tú llevas el taller y el elevador 1',
  body:`<p>Llegan clientes con averías. Decide quién repara cada coche y, en tu elevador, <b>hazlo tú con tus manos</b>: mételo, súbelo, diagnostica y aprieta. Igual que en un taller de verdad, se evalúa la seguridad.</p>
  <div class="how"><div><b>1 · Reparte</b>Toca un coche y luego un elevador.</div><div><b>2 · Repara</b>6 pasos guiados, con nota y estrellas.</div><div><b>3 · No hagas esperar</b>Si se acaba la paciencia, el cliente se va.</div></div>
  <p style="color:var(--muted);font-size:13.5px">Todo se hace con el ratón o el dedo: <b>mantén pulsado</b> para conducir, subir, bajar y apretar. También vale el teclado: flechas y <kbd>Espacio</kbd>. El turno dura unos 6 minutos.</p>`,
  buttons:[{label:'Empezar turno',primary:true,fn:()=>{audio();sfx.ok()}}]});
resize();hud();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
