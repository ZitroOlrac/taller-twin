<style>
/* Layout: una sola pantalla de juego (canvas 16:9) con el HUD encima y la instructora + mandos táctiles debajo. Aspecto de nave de taller: hormigón oscuro y ámbar de seguridad. Un único look oscuro, a propósito. */
:root{
  --bg:#101417; --panel:#1b2227; --panel2:#242d34; --line:#36424c;
  --fg:#e8edf0; --muted:#9fadb7; --amber:#f2b33d; --ink:#1b1404;
  --ok:#5cc28a; --bad:#ff6b5e; --info:#6fb6ff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1280px;margin:0 auto;padding-block:14px 40px;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(-45deg,var(--amber) 0 10px,transparent 10px 20px)}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.05em;text-transform:uppercase;line-height:1;margin:0}
.brand span{color:var(--amber)}
.stat{display:flex;flex-direction:column;min-width:0}
.stat b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat.warn b{color:var(--bad)}
.hud .grow{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;min-width:44px;min-height:40px;padding:6px 12px;font-size:13px}
.icon-btn:hover{border-color:var(--amber)}

.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#161b1f}
#game{display:block;width:100%;max-width:100%;aspect-ratio:16/9;touch-action:none;cursor:pointer}

.coach{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:64px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--amber);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;flex:none}
.coach .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.coach p{margin:0;font-size:16px;text-wrap:pretty}
.coach .msg{flex:1;min-width:0}
kbd{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap}


.overlay{position:fixed;inset:0;background:rgba(6,8,10,.7);display:grid;place-items:center;z-index:40;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:620px;width:100%;max-height:100%;overflow:auto}
.modal header{padding:22px 24px 8px;position:relative}
.modal header::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(-45deg,var(--amber) 0 10px,transparent 10px 20px)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:600}
.modal h2{margin:6px 0 0;font-family:var(--display);font-size:38px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1;text-wrap:balance}
.mb{padding:10px 24px 6px;display:flex;flex-direction:column;gap:12px}
.mb p{margin:0}
.modal footer{padding:14px 24px 22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 16px;min-height:46px;font-weight:600}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn:hover{border-color:var(--amber)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.pick{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:46px}
.pick:has(input:checked){border-color:var(--amber);background:rgba(242,179,61,.12)}
.pick input{width:20px;height:20px;accent-color:var(--amber);flex:none}
.modal.wide{max-width:860px}
.grp{border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;margin:0}
.grp legend{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);padding:0 6px}
.libreta{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.libreta summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.libreta ul{margin:6px 0 4px;padding-left:18px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.verdict{border-radius:10px;padding:10px 12px;border:1px solid var(--ok);background:rgba(92,194,138,.08);display:flex;flex-direction:column;gap:4px}
.verdict.fail{border-color:var(--bad);background:rgba(255,107,94,.08)}
.verdict span{font-size:12.5px;color:var(--muted)}
.verdict ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.how div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.how b{display:block;color:var(--fg);font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:14px}
.checks .mk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ok);color:var(--ok);display:grid;place-items:center;font-size:12px;font-weight:700}
.checks .fail .mk{border-color:var(--bad);color:var(--bad)}
.tag{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-left:6px}
.stars{font-size:34px;letter-spacing:4px;color:var(--amber);line-height:1}
.stars .off{color:var(--line)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.sum div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.sum b{display:block;font-family:var(--mono);font-size:20px}
.sum small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.foot{color:var(--muted);font-size:12.5px;text-align:center}
.foot a{color:var(--amber)}
@media (max-width:640px){.brand{font-size:22px}.stat b{font-size:17px}.coach p{font-size:14.5px}.modal h2{font-size:30px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<div class="app">

</div>

<div class="overlay" id="ov" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mT" id="modal"></div></div>

const tones={};
function tone(name,on,f,v,type){if(!AC)return;let t=tones[name];
  if(on&&soundOn){if(!t){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';g.gain.value=0;o.connect(g).connect(AC.destination);o.start();t=tones[name]={o,g,k:'t'}}t.o.frequency.setTargetAtTime(f,AC.currentTime,.03);t.g.gain.setTargetAtTime(v,AC.currentTime,.04)}
  else if(t){t.g.gain.setTargetAtTime(0,AC.currentTime,.04);delete tones[name];setTimeout(()=>{try{t.o.stop()}catch(e){}},250)}}
function noise(name,on,freq,v){if(!AC)return;let t=tones[name];
  if(on&&soundOn){if(!t){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
      const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const fl=AC.createBiquadFilter();fl.type='lowpass';const g=AC.createGain();g.gain.value=0;s.connect(fl).connect(g).connect(AC.destination);s.start();t=tones[name]={o:s,f:fl,g}}
    t.f.frequency.setTargetAtTime(freq,AC.currentTime,.03);t.g.gain.setTargetAtTime(v,AC.currentTime,.03)}
  else if(t){t.g.gain.setTargetAtTime(0,AC.currentTime,.04);delete tones[name];setTimeout(()=>{try{t.o.stop()}catch(e){}},250)}}
function allTonesOff(){Object.keys(tones).forEach(k=>{tones[k].f?noise(k,false):tone(k,false)})}

/* ================= ENTRADA ================= */
const keys={up:0,down:0,act:0};let actEdge=false,hold=null;const ptr={x:0,y:0},UI=[];
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'act'};
window.addEventListener('keydown',e=>{const k=KM[e.code];if(!k||!$('ov').hidden)return;e.preventDefault();audio();if(k==='act'&&!keys.act)actEdge=true;keys[k]=1});
window.addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=0});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=0;hold=null;allTonesOff()});
function takeAct(){const a=actEdge;actEdge=false;return a}

/* ================= ESTADO ================= */
const CASES=8, STEPS=['Entrada','Inspección en el suelo','Subir el coche','Mirar por debajo'];
let G,T=0,played=false;
function newDay(){G={n:0,score:0,ok:0,stars:[],paused:false,R:null,shake:0,parts:[],toast:null};nextCase()}
function nextCase(){
  G.n++;const cs=rollCase(G.n);
  const car={...cs,plate:plate(),model:pick(MODELS),color:pick(PAINT)};
  G.R={car,step:0,t:0,time:0,notes:[],last:null,safe:{k4:null,k5:null},
    drive:{y:900,x:450+rand(-55,55),v:0},
    eng:{on:false,crank:0,rpm:0,run:0,fails:0,miss:0},
    insp:{gas:0,brake:0,wheel:0,ang:0,clonc:0,bounce:null,hood:false,chk:{},dash:0,lights:0,smoke:0,brakeDip:0},
    lift:{h:0,checked:false,locked:false,warned:false},under:{chk:{}},hl:null};
  G.parts=[];allTonesOff();
  setMsg(G.n===1?'Primer caso. El coche entra solo al elevador. Cuando pare, toca la <b>P</b> del freno de mano.':`Caso ${G.n}. Llega un ${car.model}. Toca la <b>P</b> cuando pare.`);
}
let msgHTML='';function setMsg(h){if(h!==msgHTML){msgHTML=h;$('msg').innerHTML=h}}
function toast(t,cls){G.toast={t,cls,life:3}}
function note(id){const R=G.R;if(R.notes.some(n=>n.id===id))return false;const t=clue(id);R.notes.push({id,t});R.last={t,life:4.5};sfx.note();
  if(G.n===1&&R.notes.length===5&&R.step===1)setMsg('Bien, ya tienes 5 pistas. Sigue probando o toca <b>Levantar</b> para mirar por debajo.');return true}
function next(){const R=G.R;R.step++;R.t=0;allTonesOff();R.eng.on=false;R.eng.rpm=0;stepEnter()}
function stepEnter(){const R=G.R;
  if(R.step===1)setMsg(`El cliente dice: «${R.car.says}». <b>Investiga.</b> Gira la <b>llave</b> para arrancar, escucha, pisa el <b>acelerador</b> y el <b>freno</b>, gira el <b>volante</b>, mira el <b>cuadro</b> y el <b>escape</b>, empuja el coche, abre el <b>capó</b>…`);
  if(R.step===2)setMsg('En la botonera, <b>mantén pulsado ▲</b> hasta <b>20 cm</b> y suelta. Luego <b>toca un brazo</b> para comprobar que apoya bien.');
  if(R.step===3)setMsg('Mira por debajo: <b>rueda</b>, <b>amortiguador</b>, <b>escape</b>, <b>dirección</b>, <b>transmisión</b> y <b>suelo</b>. Cuando lo tengas claro, toca el <b>informe</b>.');
}

/* ================= PRUEBAS ================= */
function startEngine(){const e=G.R.eng;if(e.on||e.crank>0)return;e.crank=fx('click')?2.2:fx('slowcrank')?2.4:1.1;e.fails=fx('click')?1:0}
function needEngine(){if(!G.R.eng.on){setMsg('Primero arranca el motor con la <b>llave</b>.');sfx.bad();return true}return false}
function objTap(id){
  const R=G.R,s=R.insp;
  if(id==='key'){if(R.eng.on){R.eng.on=false;R.eng.rpm=0;allTonesOff();setMsg('Motor apagado.');sfx.click()}else startEngine();return}
  if(id==='dash'){s.dash=3.5;note('dash');return}
  if(id==='hood'){s.hood=true;sfx.click();setMsg('Capó abierto. Toca la <b>batería</b>, la <b>varilla</b>, los <b>depósitos</b>, la <b>correa</b>, el <b>filtro</b>, la <b>bujía</b>, los <b>manguitos</b> o <b>huele</b>.');return}
  if(id==='close'){s.hood=false;sfx.click();return}
  if(id==='push'){if(!s.bounce){s.bounce={t:0};beep(120,.1,'triangle',.15)}return}
  if(id==='tail'){if(needEngine())return;s.smoke=3;setMsg('Miras el escape con el motor en marcha. Pisa el <b>acelerador</b> para ver mejor el humo.');setTimeout(()=>{if(G.R===R)note('smoke')},1300);return}
  if(id==='tyre'){note('tyre');return}
  if(id==='light'){s.lights=3;note('lights');return}
  if(id==='obd'){note('obd');return}
  if(id==='lift'){if(R.notes.length<4&&!R.warnLift){R.warnLift=true;sfx.bad();setMsg('Llevas pocas pruebas. Un buen técnico revisa antes de levantar. Toca <b>Levantar</b> otra vez si quieres seguir.');return}next();return}
  if(id==='report'){openReport();return}
  if(id==='batt'){note('batt');s.chk.batt=1;return}
  if(['oil','cool','bfl','psf','belt','filter','plug','hose','smell'].includes(id)){s.chk[id]=1;note(id);return}
  if(['pads','shock','tie','boot','exhaust','floor'].includes(id)){R.under.chk[id]=1;note(id)}
}
function update(dt){
  const R=G.R;R.t+=dt;if(R.step<4)R.time+=dt;const act=takeAct();
  if(R.last){R.last.life-=dt;if(R.last.life<=0)R.last=null}
  const U=keys.up||hold==='up',D=keys.down||hold==='down';
  if(R.step===0){const d=R.drive,rest=d.y-360;
    if(rest>.5){d.v=Math.min(170,rest*1.8+12);d.y=Math.max(360,d.y-d.v*dt);tone('eng',true,40+d.v*.1,.03,'sawtooth')}
    else if(d.v){d.y=360;d.v=0;tone('eng',false);sfx.click()}
    d.x+=(450-d.x)*Math.min(1,dt*2.5);
    if(act&&d.v<25){sfx.ok();next()}
  }
  if(R.step===1){const s=R.insp,e=R.eng;
    // arranque
    if(e.crank>0){e.crank-=dt;
      if(fx('click')){if(Math.floor(e.crank*2.5)!==Math.floor((e.crank+dt)*2.5))sfx.relay();
        if(e.crank<=0){note('start');setMsg('No arranca: solo hace clic. Lo arrancas con el <b>arrancador de pinzas</b> para seguir probando.');e.crank=0;setTimeout(()=>{if(G.R===R){R.eng.on=true;R.eng.run=0}},900)}}
      else{const rate=fx('slowcrank')?3.2:9;noise('crank',true,700,.11*(.55+.45*Math.sin(T*rate*6.28)));
        if(e.crank<=0){noise('crank',false);e.on=true;e.run=0;note('start');beep(70,.35,'sawtooth',.12,45)}}}
    // motor en marcha
    const gas=hold==='gas'&&e.on,brk=hold==='brake',wh=hold==='wheel';
    if(hold==='gas'&&!e.on&&e.crank<=0&&!R.warnGas){R.warnGas=1;needEngine()}
    if(hold!=='gas')R.warnGas=0;
    const target=e.on?(gas?(fx('slow')?3200:5200):820):0;
    e.rpm+=(target-e.rpm)*Math.min(1,dt*(gas?(fx('slow')?.8:1.7):2.4));
    if(e.on){e.run+=dt;
      let vol=.05,f=34+e.rpm*.03;
      if(fx('misfire')){e.miss-=dt;if(e.miss<=0){e.miss=rand(.25,.7);G.shake=Math.max(G.shake,.08)}if(e.miss<.12)vol=.008}
      tone('eng',true,f,vol,'sawtooth');
      if(fx('loud'))noise('exh',true,240+e.rpm*.05,.04+e.rpm/5200*.22);else noise('exh',true,180+e.rpm*.03,.015+e.rpm/5200*.03);
      if(fx('squeal')&&e.rpm>1200)tone('sq',true,2300+e.rpm*.22+Math.sin(T*40)*60,.008+e.rpm/5200*.03,'sine');else tone('sq',false);
      if(e.run>2.2)note('idle');
      if(gas){s.gas+=dt;if(s.gas>1.3)note('gas')}
    }else{tone('eng',false);noise('exh',false);tone('sq',false)}
    if(brk){s.brake+=dt;s.brakeDip=Math.min(1,s.brakeDip+dt*4);
      if(fx('screech'))tone('br',true,3000+Math.sin(T*27)*160,.016,'sawtooth');
      if(fx('judder')){G.shake=Math.max(G.shake,.1);tone('jd',true,55+Math.sin(T*30)*10,.08*(.5+.5*Math.sin(T*42)),'square')}
      noise('road',true,420,.03);
      if(s.brake>1.3)note('brake')}
    else{tone('br',false);tone('jd',false);noise('road',false);s.brakeDip=Math.max(0,s.brakeDip-dt*3)}
    if(wh){s.wheel+=dt;s.ang=Math.sin(s.wheel*4)*1.2;s.clonc-=dt;
      if(fx('clonc')&&s.clonc<=0){beep(92,.16,'triangle',.28);G.shake=.12;s.clonc=.55}
      if(fx('clack')&&s.clonc<=0){for(let i=0;i<4;i++)setTimeout(()=>beep(1400,.02,'square',.08),i*70);s.clonc=.45}
      if(fx('whine'))tone('wh',true,780+Math.sin(T*6)*90,.03,'sawtooth');
      if(s.wheel>1.5)note('wheel')}
    else{s.ang*=Math.pow(.02,dt);tone('wh',false)}
    if(s.bounce){s.bounce.t+=dt;if(s.bounce.t>2.3){note('push');s.bounce=null}}
    s.dash=Math.max(0,s.dash-dt);s.lights=Math.max(0,s.lights-dt);s.smoke=Math.max(0,s.smoke-dt);
    // partículas
    const sc=fx('smoke');
    if(e.on&&(s.smoke>0||gas)){const n=gas?3:1;for(let i=0;i<n;i++)G.parts.push({x:166,y:536,vx:rand(-90,-40),vy:rand(-30,-8),r:rand(6,10),life:1.6,max:1.6,col:sc||'rgba(200,210,220,.35)',a:sc?.75:.18})}
    if(fx('steam')&&e.on&&e.run>1.5&&Math.random()<.5)G.parts.push({x:rand(600,680),y:398,vx:rand(-10,20),vy:rand(-70,-40),r:rand(8,14),life:1.8,max:1.8,col:'#e9eef2',a:.35});
  }
  if(R.step===2){const l=R.lift;
    if(!l.locked){const dir=(U?1:0)-(D?1:0);l.h=clamp(l.h+dir*.34*dt,0,2);if(dir)tone('hyd',true,dir>0?75:60,.025,'sawtooth');else tone('hyd',false);
      if(!l.checked&&l.h>.42&&!l.warned){l.warned=true;l.checked=true;R.safe.k4=false;sfx.bad();G.shake=.3;setMsg('<b>Cuidado.</b> Te has pasado la parada de 20 cm. Siempre se para a comprobar que el coche apoya bien. Sigue subiendo y pon el <b>seguro</b>.')}
      if(act){
        if(!l.checked){if(l.h>.1&&l.h<.36){l.checked=true;R.safe.k4=true;sfx.ok();setMsg('Apoyo correcto. <b>Mantén pulsado ▲</b> hasta la franja verde y toca el <b>candado</b>.')}else{sfx.bad();setMsg('Para cerca de la marca de <b>20 cm</b> para comprobar.')}}
        else if(l.h>=1.55&&l.h<=1.85){l.locked=true;tone('hyd',false);if(R.safe.k5==null)R.safe.k5=true;sfx.ok();setTimeout(()=>{if(G.R===R&&R.step===2)next()},500)}
        else{R.safe.k5=false;sfx.bad();setMsg('El seguro solo se pone a la altura de trabajo, la <b>franja verde</b>.')}
      }}
  }
  // partículas
  G.parts=G.parts.filter(p=>(p.life-=dt)>0);G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=12*dt;p.r+=18*dt});
}

/* ================= INFORME Y RESULTADO ================= */
function openReport(){
  const R=G.R;
  openModal({eyebrow:`Caso ${G.n} de ${CASES} · ${R.car.model} ${R.car.plate}`,title:'Informe de diagnóstico',wide:1,
    body:`<p>El cliente dijo: «${esc(R.car.says)}». Marca <b>todas</b> las averías que has encontrado. Puede haber más de una, y no todo lo raro es una avería.</p>
    <details class="libreta"><summary>Tu libreta · ${R.notes.length} pruebas</summary><ul>${R.notes.map(n=>`<li>${esc(n.t)}</li>`).join('')}</ul></details>
    ${GROUPS.map(([g,gn])=>`<fieldset class="grp"><legend>${gn}</legend><div class="picks">${FKEYS.filter(k=>FAULTS[k].g===g).map(k=>`<label class="pick" for="rep-${k}"><input type="checkbox" id="rep-${k}"><span>${esc(FAULTS[k].n)}</span></label>`).join('')}</div></fieldset>`).join('')}`,
    buttons:[{label:'Seguir investigando',fn:()=>{}},{label:'Firmar el informe',primary:true,fn:signReport}]});
}
function signReport(){
  const R=G.R,sel=FKEYS.filter(k=>{const e=$('rep-'+k);return e&&e.checked});
  if(!sel.length){toast('Marca al menos una avería','bad');setTimeout(openReport,60);return}
  allTonesOff();
  const act=R.car.faults,missed=act.filter(k=>!sel.includes(k)),extra=sel.filter(k=>!act.includes(k)),right=act.filter(k=>sel.includes(k));
  const allOk=!missed.length&&!extra.length,safeOk=R.safe.k4!==false&&R.safe.k5!==false;
  let pts=right.length*70-missed.length*40-extra.length*30;
  if(allOk){pts+=40;pts+=Math.round(clamp((300-R.time)/210,0,1)*60)}
  if(!safeOk)pts-=30;
  pts=Math.max(0,pts);
  const stars=allOk&&safeOk&&R.time<200?3:allOk?2:(missed.length+extra.length)<=1&&right.length?1:0;
  G.score+=pts;G.stars.push(stars);if(allOk)G.ok++;
  if(allOk)sfx.coin();else sfx.bad();
  const keyClues=k=>Object.values(FAULTS[k].c).map(t=>`<li>${esc(t)}</li>`).join('');
  const body=`<div class="stars" aria-label="${stars} de 3 estrellas">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div>
    <div class="sum"><div><b>+${pts}</b><small>Puntos</small></div><div><b>${mmss(R.time)}</b><small>Tiempo</small></div><div><b>${R.notes.length}</b><small>Pruebas</small></div></div>
    <p style="margin-bottom:-4px"><b>Lo que tenía el coche</b></p>
    ${act.map(k=>{const m=missed.includes(k);return `<div class="verdict ${m?'fail':'okv'}"><b>${m?'✕ No la encontraste':'✓ Bien visto'}: ${esc(FAULTS[k].n)}</b><span>Pistas que la delataban:</span><ul>${keyClues(k)}</ul></div>`}).join('')}
    ${extra.map(k=>`<div class="verdict fail"><b>✕ Estaba bien: ${esc(FAULTS[k].n)}</b><span>Habrías cambiado una pieza sin necesidad.</span></div>`).join('')}
    ${R.car.water&&!act.some(k=>FAULTS[k].fx.drip)?'<p style="color:var(--muted);font-size:13.5px">Las gotas transparentes sin olor eran agua del aire acondicionado: es normal.</p>':''}
    ${safeOk?'':'<p style="color:var(--bad);font-size:13.5px">Seguridad: '+(R.safe.k4===false?'no paraste a 20 cm para comprobar el apoyo. ':'')+(R.safe.k5===false?'intentaste poner el seguro fuera de la altura de trabajo.':'')+'</p>'}`;
  openModal({eyebrow:`Caso ${G.n} de ${CASES} · «${R.car.says}»`,title:allOk?'Diagnóstico correcto':missed.length&&!right.length?'Diagnóstico equivocado':'Diagnóstico incompleto',body,
    buttons:[{label:G.n>=CASES?'Ver el resultado de la jornada':'Siguiente coche',primary:true,fn:()=>{if(G.n>=CASES)endDay();else nextCase()}}]});
}
function endDay(){
  const avg=G.stars.reduce((a,b)=>a+b,0)/G.stars.length;
  let best=0;try{best=+localStorage.getItem('tallerTwinDiagBest')||0;if(G.score>best)localStorage.setItem('tallerTwinDiagBest',String(G.score))}catch(e){}
  const rank=G.score>=1000?'Jefe de diagnosis':G.score>=750?'Técnico de diagnosis':G.score>=450?'Oficial de taller':'Aprendiz';
  openModal({eyebrow:'Fin de la jornada',title:rank,
    body:`<div class="sum"><div><b>${G.score}</b><small>Puntos${G.score>best?' · ¡récord!':best?' · récord '+best:''}</small></div><div><b>${G.ok} de ${CASES}</b><small>Diagnósticos exactos</small></div><div><b>${avg.toFixed(1).replace('.',',')} ★</b><small>Media</small></div></div>
    <p>${G.ok===CASES?'Ni un fallo: así se trabaja.':'Repasa las pistas de los casos que fallaste: cada avería deja varias huellas, y casi nunca basta con una prueba.'}</p>`,
    buttons:[{label:'Nueva jornada',primary:true,fn:()=>newDay()}]});
}

/* ================= DIBUJO ================= */
let scale=1;
function resize(){const r=cv.getBoundingClientRect();if(!r.width)return;const d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.width*H/W*d);scale=cv.width/W}
window.addEventListener('resize',resize);try{new ResizeObserver(resize).observe(cv)}catch(e){}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(t,x,y,col,size,font,al,bl){ctx.fillStyle=col;ctx.font=`${size}px ${font||DISP}`;ctx.textAlign=al||'left';ctx.textBaseline=bl||'middle';ctx.fillText(t,x,y)}
function wrap(t,x,y,maxW,lh,col,size,font,al){ctx.font=`${size}px ${font||BODY}`;const words=t.split(' ');let line='',yy=y;for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){txt(line,x,yy,col,size,font||BODY,al);line=w;yy+=lh}else line=test}txt(line,x,yy,col,size,font||BODY,al);return yy}
function hatch(x,y,w,h,col,lw){ctx.save();rr(x,y,w,h,0);ctx.clip();ctx.strokeStyle=col;ctx.lineWidth=lw||8;for(let i=-h;i<w+h;i+=22){ctx.beginPath();ctx.moveTo(x+i,y+h);ctx.lineTo(x+i+h,y);ctx.stroke()}ctx.restore()}
function floorGrid(x0,y0,w,h){ctx.fillStyle=C.floor;ctx.fillRect(x0,y0,w,h);ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;for(let x=x0;x<x0+w;x+=48){ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y0+h);ctx.stroke()}for(let y=y0;y<y0+h;y+=48){ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+w,y);ctx.stroke()}}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=amt<0?0:255,k=Math.abs(amt);r=Math.round(r+(t-r)*k);g=Math.round(g+(t-g)*k);b=Math.round(b+(t-b)*k);return `rgb(${r},${g},${b})`}
/* coche visto desde arriba, morro hacia +x */
function carTop(x,y,len,wid,color,rot,glow){
  const L=len/2,Wd=wid/2;
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  // sombra en el suelo

  if(R.step>=2){const yb=liftScene();if(R.step===3)drawUnder(yb);if(R.step===2)txt(R.lift.locked?'SEGURO PUESTO':'SEGURO QUITADO',40,40,R.lift.locked?C.ok:C.amber,20);else txt('COCHE ARRIBA · MIRA POR DEBAJO',450,40,C.muted,18,DISP,'center')}
  ctx.restore();
  drawButtons();
  if(R.last){ctx.globalAlpha=Math.min(1,R.last.life);ctx.font=`17px ${BODY}`;const w=Math.min(840,ctx.measureText(R.last.t).width+60);ctx.fillStyle='rgba(16,20,23,.95)';rr(450-w/2,112,w,46,10);ctx.fill();ctx.strokeStyle=C.amber;ctx.lineWidth=2;ctx.stroke();
    txt('✎',450-w/2+22,136,C.amber,20,BODY,'center');txt(R.last.t,450-w/2+40,136,C.fg,17,BODY);ctx.globalAlpha=1}
  drawPanel();
  if(G.toast){ctx.globalAlpha=Math.min(1,G.toast.life);ctx.font=`17px ${BODY}`;const w=ctx.measureText(G.toast.t).width+36;ctx.fillStyle='#5a1f1b';rr(450-w/2,H-60,w,40,8);ctx.fill();txt(G.toast.t,450,H-40,C.fg,17,BODY,'center');ctx.globalAlpha=1}
  if(G.paused){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);txt('EN PAUSA',W/2,H/2,C.fg,60,DISP,'center')}
}

/* ================= BUCLE ================= */
let last=performance.now(),hudT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;G.shake=Math.max(0,G.shake-dt);
  if(G.toast){G.toast.life-=dt;if(G.toast.life<=0)G.toast=null}
  if($('ov').hidden&&!G.paused)update(dt);else takeAct();
  ctx.setTransform(scale,0,0,scale,0,0);draw();
  hudT+=dt;if(hudT>.25){hudT=0;$('hCase').textContent=G.n+' / '+CASES;$('hScore').textContent=G.score;$('hTime').textContent=mmss(G.R.time);$('hOk').textContent=G.ok}
  requestAnimationFrame(frame);
}
function ptrXY(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
cv.addEventListener('pointerdown',e=>{
  audio();const [x,y]=ptrXY(e);ptr.x=x;ptr.y=y;
  if(G.paused||!$('ov').hidden)return;
  e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const b=UI.find(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h);
  if(b){if(b.id)objTap(b.id);else if(b.tap){actEdge=true;sfx.click()}else hold=b.key}
});
cv.addEventListener('pointermove',e=>{const [x,y]=ptrXY(e);ptr.x=x;ptr.y=y});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>cv.addEventListener(ev,()=>{hold=null}));
$('bPause').addEventListener('click',()=>{G.paused=!G.paused;$('bPause').setAttribute('aria-pressed',String(G.paused));$('bPause').textContent=G.paused?'Seguir':'Pausa';hold=null;allTonesOff()});
$('bSound').addEventListener('click',()=>{soundOn=!soundOn;$('bSound').setAttribute('aria-pressed',String(soundOn));$('bSound').textContent='Sonido: '+(soundOn?'sí':'no');if(!soundOn)allTonesOff();else{audio();sfx.click()}});

/* ================= INICIO ================= */
newDay();
openModal({eyebrow:'Simulador de diagnóstico · jornada de 8 coches',title:'¿Qué le pasa a este coche?',
  body:`<p>Los clientes solo te cuentan lo que notan. Lo que tiene el coche <b>lo descubres tú</b>, como en un taller de verdad: arranca y escucha, acelera, frena, gira el volante, mira el cuadro y el humo del escape, empuja la carrocería, abre el capó, mide, huele, usa el escáner y mira por debajo.</p>
  <div class="how"><div><b>22 averías</b>Frenos, motor, electricidad, refrigeración, suspensión, escape, ruedas y luces.</div><div><b>Varias a la vez</b>Desde el tercer coche puede haber más de una. Y no todo lo raro es avería.</div><div><b>Aprende</b>Al firmar el informe verás qué pistas delataban cada avería.</div></div>
  <p style="color:var(--muted);font-size:13.5px">Todo se hace tocando las cosas del taller con el ratón o el dedo. <b>Sube el volumen</b>: muchas averías se oyen.</p>`,
  buttons:[{label:'Empezar la jornada',primary:true,fn:()=>{audio();sfx.ok()}}]});
resize();requestAnimationFrame(frame);
})();

</script>
